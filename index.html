<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Aadhar Center Daily Reports</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        select { padding: 10px; font-size: 16px; margin-bottom: 20px; width: 100%; max-width: 300px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #333; color: white; }
        #loading { font-weight: bold; color: #555; }
        .table-responsive { overflow-x: auto; }
    </style>
</head>
<body>

<div class="container">
    <h2>Aadhar Center Monthly Reports</h2>
    
    <!-- Mahina chunne ke liye Dropdown -->
    <label for="monthSelect"><b>Mahina Chunein:</b></label><br>
    <select id="monthSelect" onchange="displayData()">
        <option value="">-- Mahina Select Karein --</option>
    </select>

    <p id="loading">Data load ho raha hai, kripya intezaar karein...</p>

    <!-- Data dikhane ke liye Table -->
    <div class="table-responsive">
        <table id="reportTable"></table>
    </div>
</div>

<script>
    // Aapka Web App URL jo aapne generate kiya hai
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbzNL6qUikVx_rSuCezOlawIUAK3cEuyhZePg6GKnrjIYNvK5uhSjc-908WJ_t_RW5OhSw/exec';[cite: 1]
    let globalData = {};

    // Google Apps Script se data fetch karna
    fetch(webAppUrl)
        .then(response => response.json())
        .then(data => {
            globalData = data;
            const selectTag = document.getElementById('monthSelect');
            document.getElementById('loading').style.display = 'none';

            // Saari sheets ke naam ko dropdown mein add karna
            const sheetNames = Object.keys(data);
            sheetNames.forEach(name => {
                let option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                selectTag.appendChild(option);
            });
        })
        .catch(error => {
            document.getElementById('loading'].innerText = 'Data load karne mein error aayi hai.';
            console.error('Error:', error);
        });

    // Jab user dropdown se mahina badle toh table update ho
    function displayData() {
        const selectedMonth = document.getElementById('monthSelect').value;
        const table = document.getElementById('reportTable');
        table.innerHTML = ''; // Purani table saaf karein

        if (!selectedMonth || !globalData[selectedMonth]) return;

        const rows = globalData[selectedMonth];
        rows.forEach((row, index) => {
            let tr = document.createElement('tr');
            row.forEach(cell => {
                let colElement = document.createElement(index === 0 ? 'th' : 'td');
                colElement.textContent = cell !== null ? cell : '';
                tr.appendChild(colElement);
            });
            table.appendChild(tr);
        });
    }
</script>

</body>
</html>
